# One A2A backend (the kagent controller) and one route per agent.
# Public paths use the agentregistry name (lowercase letters and digits only);
# each route rewrites to kagent's A2A path for the Kubernetes Agent name.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: kagent-a2a
  namespace: agentgateway-system
spec:
  a2a:
    host: kagent-controller.kagent.svc.cluster.local
    port: 8083
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a-eks-troubleshooter
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path: { type: PathPrefix, value: /a2a/ops/ekstroubleshooter }
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/a2a/kagent/eks-troubleshooter
      backendRefs:
        - name: kagent-a2a
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
# The registry Deployment creates the kagent Agent as <name>-<tag>-<name>.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a-platform-oncall
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path: { type: PathPrefix, value: /a2a/ops/platformoncall }
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/a2a/kagent/platformoncall-latest-platformoncall
      backendRefs:
        - name: kagent-a2a
          group: agentgateway.dev
          kind: AgentgatewayBackend
